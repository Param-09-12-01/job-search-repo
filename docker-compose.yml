services:
  mysql:
    image: mysql:8.4
    container_name: jobcopilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-jobcopilot}
      MYSQL_USER: ${DB_USERNAME:-jobcopilot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-jobcopilot}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobcopilot

  redis:
    image: redis:7.4-alpine
    container_name: jobcopilot-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - jobcopilot

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobcopilot-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-jobcopilot}
      DB_USERNAME: ${DB_USERNAME:-jobcopilot}
      DB_PASSWORD: ${DB_PASSWORD:-jobcopilot}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-256-bit-secret-value-please-override}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123!}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@jobcopilot.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_CRON: ${SCHEDULER_CRON:-0 */30 * * * *}
      GREENHOUSE_ENABLED: ${GREENHOUSE_ENABLED:-true}
      GREENHOUSE_BOARDS: ${GREENHOUSE_BOARDS:-airbnb,stripe}
      LEVER_ENABLED: ${LEVER_ENABLED:-true}
      LEVER_COMPANIES: ${LEVER_COMPANIES:-netflix,spotify}
      REMOTEOK_ENABLED: ${REMOTEOK_ENABLED:-true}
      FINDWORK_ENABLED: ${FINDWORK_ENABLED:-false}
      FINDWORK_API_KEY: ${FINDWORK_API_KEY:-}
      NOTIFY_EMAIL_ENABLED: ${NOTIFY_EMAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
      NOTIFY_TELEGRAM_ENABLED: ${NOTIFY_TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - jobcopilot

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobcopilot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - jobcopilot

volumes:
  mysql-data:
  redis-data:

networks:
  jobcopilot:
    driver: bridge
